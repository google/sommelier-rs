[package]
name = "sommelier"
version = "0.2.1"
edition = "2021"

[dependencies]
nix = { version = "0.31", features = [
    "socket",
    "poll",
    "uio",
    "fs",
    "ioctl",
    "mman",
] }
tokio = { version = "1.49", features = ["full"] }
libc = "0.2"
gbm = { version = "0.16", default-features = false, features = ["drm-support"] }
drm = "0.14"
zerocopy = { version = "0.7", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
xkbcommon = "0.8.0"

[build-dependencies]
wayland_codegen = { path = "../wayland_codegen" }

[[bin]]
name = "sommelier"
path = "src/main.rs"
