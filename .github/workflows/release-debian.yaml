name: sommelier-rs Release (Debian 13)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (must match Cargo.toml, e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Install basic tools
        run: |
          apt-get update && apt-get -y install \
            build-essential \
            curl \
            git \
            pkg-config \
            jq \
            libxkbcommon-dev \
            libgbm-dev \
            libdrm-dev \
            libexpat1-dev

      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify tag matches Cargo.toml
        run: |
          CARGO_VERSION=$(cargo read-manifest --manifest-path sommelier/Cargo.toml | jq -r '.version')
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ github.event.inputs.version }}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi

          echo "Found Cargo.toml version: ${CARGO_VERSION}"
          echo "Found Target version: ${TAG_VERSION}"

          if [ "${CARGO_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Version mismatch! Cargo.toml says ${CARGO_VERSION} but target says ${TAG_VERSION}."
            exit 1
          fi
          echo "Versions match. Proceeding with build..."

      - name: Install aarch64 dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y gcc-aarch64-linux-gnu libxkbcommon-dev:arm64 libgbm-dev:arm64 libdrm-dev:arm64 libexpat1-dev:arm64

      - name: Add Rust Target
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          rustup target add aarch64-unknown-linux-gnu

      - name: Build Release Binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --verbose --target ${{ matrix.target }}

      - name: Prepare and Rename Artifact
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            SHORT_ARCH="x86_64"
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            SHORT_ARCH="aarch64"
          else
            echo "Error: Unknown matrix target '${{ matrix.target }}'. Failing fast."
            exit 1
          fi
          FINAL_NAME="sommelier_rs-${VERSION}-${SHORT_ARCH}-debian13"
          mv target/${{ matrix.target }}/release/sommelier ./${FINAL_NAME}
          
          # Expose artifact name and release tag for next step
          echo "ARTIFACT_NAME=${FINAL_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${VERSION}" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ./${{ env.ARTIFACT_NAME }}
          draft: false
          prerelease: false
